# Local stack for Typesense Search integration tests (issue #11).
# Ports are offset from defaults so this does not clash with a developer's Typesense/MySQL.
#
# Usage:
#   docker compose -f docker-compose.integration.yml up -d
#   export TYPESENSE_HOST=http://127.0.0.1:8118
#   export TYPESENSE_API_KEY=typesense-integration-test-key
#   export WP_TESTS_DB_HOST=127.0.0.1:3307
#   bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3307 latest true
#   composer test:integration

services:
  mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress_test
    ports:
      - "3307:3306"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12

  typesense:
    image: typesense/typesense:27.1
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: typesense-integration-test-key
      TYPESENSE_ENABLE_CORS: "true"
    ports:
      - "8118:8108"
    volumes:
      - typesense-integration-data:/data
    command: "--data-dir /data --api-key=typesense-integration-test-key --enable-cors"

volumes:
  typesense-integration-data:
